# -----------------------------------------------------------------------------
# config for MLPipeline on Epilepsy classification using SENSOR features
# -----------------------------------------------------------------------------

global_experiment_id: "epilepsy_sensor_features"
data_path: "/home/mat/scratch/signal_features/descriptors/combined/sensor_subject_features.csv"
results_dir: "/home/mat/scratch/EEG_results/results/ml/new_ml/sensor"
results_file: "epilepsy_sensor"

defaults:
  random_state: 42
  n_jobs: -1
  cv_kwargs:
    cv_strategy: "stratified"
    n_splits: 5
    shuffle: true
    random_state: 42
  
  clean_cfg:
    mode: "any"
    sep: "_ch-"
    reverse: true
    verbose: true
    min_abs_fraction: 0.0

  grid_balance: false
  require_full_grid: false
  target_columns: ["Epilepsy"]
  sep: "_ch-"
  reverse: true
  spatial_units: ['C3', 'C4', 'Cz', 'F3', 'F4', 'F7', 'F8', 'Fp1', 'Fp2', 'Fz', 'O1', 'O2', 'P3', 'P4', 'Pz', 'T3', 'T4', 'T5', 'T6']
  
  feature_names: "all"
  
  balance:
    strategy: "undersample"
    covariates: ["Age", "Sex"]
    qbins: 5
    binning: "quantile"
    seed: 42
    prefer_clean_rows: true

analyses:
  - id: "classification_baseline_sensor"
    task: "classification"
    analysis_type: "baseline"
    row_filter:
      # - column: "condition"
      #   values: "EC_baseline"
      #   operator: "=="
      - column: "TDAH"
        values: "0"
        operator: "=="
      - column: "TSA"
        values: "0"
        operator: "=="
      - column: "Epilepsy"
        values: "2"
        operator: "!="

    models:
      - "Logistic Regression"
      - "Random Forest"
    metrics:
      - "accuracy" 
      - "roc_auc"
      - "f1"
      - "balanced_accuracy"
    scoring: "balanced_accuracy"

  - id: "classification_feature_selection_sensor"
    task: "classification"
    analysis_type: "feature_selection"
    row_filter:
      - column: "condition"
        values: "EC_baseline"
        operator: "=="
      - column: "TDAH"
        values: "0"
        operator: "=="
      - column: "TSA"
        values: "0"
        operator: "=="
      - column: "Epilepsy"
        values: "2"
        operator: "!="
    models:
      - "Random Forest"
    metrics:
      - "f1"
      - "roc_auc"
      - "balanced_accuracy"
      - "accuracy"
    n_features: 10
    direction: "forward"
    scoring: "balanced_accuracy"
