# -----------------------------------------------------------------------------
# Configuration for Feature Importance (Lasso) ML analyses
# -----------------------------------------------------------------------------

global_experiment_id: "epilepsy_feature_importance_lasso"
pooling: "sensor"  # or "region"
representation: "epoch"  # or "subject"
data_path: "/home/mat/scratch/signal_features/descriptors/combined/sensor_epoch_features.csv"
results_dir: "/home/mat/scratch/EEG_results/results/ml/new_ml/feature_importance"
results_file: "feature_importance"

defaults:
  random_state: 42
  n_jobs: -1
  cv_kwargs:
    cv_strategy: "stratified"
    n_splits: 5
    shuffle: true
    random_state: 42
  
  clean_cfg:
    mode: "any"
    sep: "_ch-" # Make sure this matches your data
    reverse: true
    verbose: true
    min_abs_fraction: 0.0

  grid_balance: false
  require_full_grid: false
  target_columns: ["Epilepsy"]
  sep: "_ch-"
  reverse: true
  spatial_units: ['C3', 'C4', 'Cz', 'F3', 'F4', 'F7', 'F8', 'Fp1', 'Fp2', 'Fz', 'O1', 'O2', 'P3', 'P4', 'Pz', 'T3', 'T4', 'T5', 'T6']
  
  feature_names: "all"
  
  balance:
    strategy: "undersample"
    covariates: ["Age", "Sex"]
    qbins: 5
    binning: "quantile"
    seed: 42
    prefer_clean_rows: true

analyses:
  # 1. All Features & All Sensors (Lasso to extract coefficients)
  - id: "classification_lasso_all"
    task: "classification"
    analysis_type: "baseline"
    analysis_unit: "all"
    row_filter:
      # - column: "condition"
      #   values: "EC_baseline"
      #   operator: "=="
      - column: "TDAH"
        values: "0"
        operator: "=="
      - column: "TSA"
        values: "0"
        operator: "=="
      - column: "Epilepsy"
        values: "2"
        operator: "!="
    models:
      - "Logistic Regression"
    metrics:
      - "accuracy" 
      - "roc_auc"
      - "f1"
      - "balanced_accuracy"
    scoring: "balanced_accuracy"

  # 2. Per-Feature Decoding (1 filter feature x All Sensors)
  - id: "classification_lasso_per_feature"
    task: "classification"
    analysis_type: "baseline"
    analysis_unit: "feature"
    row_filter:
      # - column: "condition"
      #   values: "EC_baseline"
      #   operator: "=="
      - column: "TDAH"
        values: "0"
        operator: "=="
      - column: "TSA"
        values: "0"
        operator: "=="
      - column: "Epilepsy"
        values: "2"
        operator: "!="
    models:
      - "Logistic Regression"
    metrics:
      - "accuracy" 
      - "roc_auc"
      - "f1"
      - "balanced_accuracy"
    scoring: "balanced_accuracy"
    
  # 3. Per-Sensor Decoding (1 Sensor x All its internal features)
  - id: "classification_lasso_per_sensor"
    task: "classification"
    analysis_type: "baseline"
    analysis_unit: "sensor"
    row_filter:
      # - column: "condition"
      #   values: "EC_baseline"
      #   operator: "=="
      - column: "TDAH"
        values: "0"
        operator: "=="
      - column: "TSA"
        values: "0"
        operator: "=="
      - column: "Epilepsy"
        values: "2"
        operator: "!="
    models:
      - "Logistic Regression"
    metrics:
      - "accuracy" 
      - "roc_auc"
      - "f1"
      - "balanced_accuracy"
    scoring: "balanced_accuracy"
